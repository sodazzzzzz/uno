name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: |
            --append-system-prompt "Strictly enforce the project review guidelines in .github/REVIEW_GUIDELINES.md — read that file first. Verify the architecture invariants and required tests it lists. Follow its review philosophy: prioritize correctness, security and reliability; reject speculative generality, style-only nits and over-engineering with a brief note; report each finding with a severity and let the author decide what to apply."
            --model claude-opus-4-8
            --max-turns 25
