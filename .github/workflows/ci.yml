name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs widen only if they need to.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis + compile gate. One matrix leg per check = parallel,
  # individually-named status checks that share identical setup.
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    env:
      # Run checks in :test so compile warnings cover test/support too and the
      # build cache stays coherent with the test job below.
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: format-check, cmd: mix format --check-formatted }
          - { task: compile-warnings-as-errors, cmd: mix compile --warnings-as-errors }
          - { task: credo, cmd: mix credo --strict }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Elixir/OTP (versions from .tool-versions)
        uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: ${{ matrix.task }}
        run: ${{ matrix.cmd }}

  # Test suite (no database — project is generated with --no-ecto).
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Elixir/OTP (versions from .tool-versions)
        uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

  # Secret scanning over the full history.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organizations*
          # (free for personal/public repos), so it is intentionally omitted.
